<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard personale · Goffredo d'Onofrio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:        #f5f4f1;
      --bg-1:      #eceae5;
      --surface:   #ffffff;
      --surface-2: #f9f8f6;
      --border:    rgba(0,0,0,0.08);
      --border-md: rgba(0,0,0,0.14);
      --text:      #111110;
      --muted:     #6b6860;
      --muted-2:   #9e9b96;
      --blue:      #1d6af8;
      --blue-light:#e8efff;
      --amber:     #d97706;
      --amber-light:#fef3c7;
      --green:     #16a34a;
      --green-light:#dcfce7;
      --shadow-sm: 0 1px 4px rgba(0,0,0,0.06), 0 4px 16px rgba(0,0,0,0.05);
      --shadow:    0 2px 8px rgba(0,0,0,0.07), 0 12px 36px rgba(0,0,0,0.08);
      --shadow-lg: 0 4px 16px rgba(0,0,0,0.08), 0 24px 60px rgba(0,0,0,0.12);
      --radius:    24px;
      --radius-sm: 14px;
      --mono:      "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; overflow-x: hidden; }
    body {
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    .shell {
      max-width: 1320px;
      margin: 0 auto;
      padding: 32px 24px 72px;
    }

    /* ===== TOPBAR ===== */
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      padding: 16px 24px;
      border-radius: 18px;
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      margin-bottom: 40px;
      flex-wrap: wrap;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }
    .brand-mark {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: var(--text);
      color: #fff;
      font-weight: 900;
      font-size: 15px;
      letter-spacing: -.03em;
      flex-shrink: 0;
    }
    .brand-text { min-width: 0; }
    .brand-eyebrow {
      font: 700 10px/1 var(--mono);
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--muted-2);
      margin-bottom: 5px;
    }
    .brand-title {
      margin: 0;
      font-size: 17px;
      letter-spacing: -.025em;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
    }

    /* clock */
    .clock-box {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
    }
    .clock-time {
      font: 700 28px/1 var(--mono);
      letter-spacing: -.02em;
      color: var(--text);
    }
    .clock-sub {
      font: 500 12px/1 Inter, sans-serif;
      color: var(--muted);
      text-transform: capitalize;
    }

    /* ===== HERO ===== */
    .hero {
      margin-bottom: 52px;
    }
    .hero-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font: 700 11px/1 var(--mono);
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--muted-2);
      margin-bottom: 16px;
    }
    .hero-label::before {
      content: "";
      display: block;
      width: 20px;
      height: 1.5px;
      background: var(--muted-2);
      border-radius: 2px;
    }
    .hero-name {
      margin: 0;
      font-size: clamp(52px, 8vw, 96px);
      line-height: .94;
      letter-spacing: -.05em;
      font-weight: 900;
      color: var(--text);
    }
    .hero-name span {
      color: var(--muted-2);
    }

    /* ===== SECTION ===== */
    .section-head {
      display: flex;
      align-items: baseline;
      gap: 16px;
      margin-bottom: 20px;
      padding-top: 36px;
      border-top: 1.5px solid var(--border);
    }
    .section-num {
      font: 700 11px/1 var(--mono);
      letter-spacing: .2em;
      color: var(--muted-2);
    }
    .section-title {
      margin: 0;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .22em;
      color: var(--muted);
    }
    .section-sub {
      margin-left: auto;
      font-size: 13px;
      color: var(--muted-2);
    }

    /* ===== CAROUSEL ===== */
    .carousel-shell { display: grid; gap: 12px; }
    .carousel-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .carousel-meta {
      font: 700 11px/1 var(--mono);
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--muted-2);
    }
    .carousel-buttons { display: flex; gap: 8px; }
    .carousel-btn {
      appearance: none;
      border: 1.5px solid var(--border-md);
      background: var(--surface);
      color: var(--text);
      border-radius: 999px;
      padding: 9px 18px;
      font: 700 11px var(--mono);
      letter-spacing: .12em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background .15s, border-color .15s, transform .15s;
      box-shadow: var(--shadow-sm);
    }
    .carousel-btn:hover { background: var(--bg-1); border-color: var(--border-md); }
    .carousel-btn:active { transform: translateY(1px); }
    .carousel-window { overflow: hidden; position: relative; cursor: grab; }
    .carousel-window.dragging { cursor: grabbing; }
    .carousel-track {
      display: flex;
      gap: 0;
      transition: transform .35s cubic-bezier(.22,.8,.36,1);
      will-change: transform;
      touch-action: pan-y;
      user-select: none;
    }
    .carousel-track.is-dragging { transition: none; }
    .carousel-slide { min-width: 100%; padding: 2px; }
    .slide-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }
    .carousel-dots {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-top: 4px;
    }
    .carousel-dot {
      width: 24px;
      height: 3px;
      border-radius: 999px;
      background: var(--border-md);
      border: 0;
      cursor: pointer;
      padding: 0;
      transition: background .2s, width .2s;
    }
    .carousel-dot:hover { background: var(--muted); }
    .carousel-dot.active {
      background: var(--text);
      width: 40px;
    }

    /* ===== PROJECT CARDS — hero style ===== */
    .project-card {
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-decoration: none;
      color: inherit;
      border-radius: var(--radius);
      background: var(--surface);
      border: 1.5px solid var(--border);
      box-shadow: var(--shadow);
      transition: transform .22s ease, box-shadow .22s ease, border-color .22s ease;
      padding: 28px 28px 24px;
      min-height: 240px;
    }
    .project-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg);
      border-color: var(--border-md);
    }

    /* accent strips */
    .accent-blue::after,
    .accent-amber::after,
    .accent-green::after {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      border-radius: var(--radius) var(--radius) 0 0;
    }
    .accent-blue::after  { background: var(--blue); }
    .accent-amber::after { background: var(--amber); }
    .accent-green::after { background: var(--green); }

    /* color-tinted card background */
    .accent-blue  { background: linear-gradient(160deg, var(--blue-light) 0%, var(--surface) 55%); }
    .accent-amber { background: linear-gradient(160deg, var(--amber-light) 0%, var(--surface) 55%); }
    .accent-green { background: linear-gradient(160deg, var(--green-light) 0%, var(--surface) 55%); }

    .card-top {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card-tags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .card-tag {
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      border-radius: 999px;
      font: 700 9px/1 var(--mono);
      letter-spacing: .14em;
      text-transform: uppercase;
      border: 1px solid var(--border-md);
      background: rgba(255,255,255,0.6);
      color: var(--muted);
    }
    .accent-blue  .card-tag:first-child { color: var(--blue);  border-color: rgba(29,106,248,.25); background: rgba(29,106,248,.07); }
    .accent-amber .card-tag:first-child { color: var(--amber); border-color: rgba(217,119,6,.25);  background: rgba(217,119,6,.07);  }
    .accent-green .card-tag:first-child { color: var(--green); border-color: rgba(22,163,74,.25);  background: rgba(22,163,74,.07);  }

    .card-name {
      font-size: clamp(32px, 3.6vw, 44px);
      font-weight: 900;
      letter-spacing: -.04em;
      line-height: .96;
      margin: 0;
      color: var(--text);
    }

    .card-bottom {
      margin-top: 24px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }
    .card-cta {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font: 700 11px/1 var(--mono);
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 8px 14px;
      border-radius: 999px;
      border: 1.5px solid var(--border-md);
      background: var(--surface);
      transition: color .18s, border-color .18s, background .18s, transform .18s;
    }
    .project-card:hover .card-cta {
      color: var(--text);
      border-color: var(--text);
      transform: translateX(3px);
    }
    .accent-blue:hover  .card-cta { color: var(--blue);  border-color: var(--blue); }
    .accent-amber:hover .card-cta { color: var(--amber); border-color: var(--amber); }
    .accent-green:hover .card-cta { color: var(--green); border-color: var(--green); }

    /* card icon — large, top-right corner */
    .card-icon {
      position: absolute;
      top: 24px;
      right: 24px;
      width: 52px;
      height: 52px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,0.7);
      border: 1px solid var(--border);
    }
    .card-icon svg {
      width: 26px;
      height: 26px;
    }
    .accent-blue  .card-icon svg { color: var(--blue); }
    .accent-amber .card-icon svg { color: var(--amber); }
    .accent-green .card-icon svg { color: var(--green); }

    /* ===== FOOTER ===== */
    .footer {
      margin-top: 56px;
      padding-top: 20px;
      border-top: 1.5px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      color: var(--muted-2);
      font: 600 11px/1.4 var(--mono);
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    .footer-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--muted-2);
      display: inline-block;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 1100px) {
      .slide-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 680px) {
      .shell { padding: 20px 16px 48px; }
      .topbar { padding: 14px 18px; }
      .slide-grid { grid-template-columns: 1fr; }
      .project-card { min-height: 200px; border-radius: 20px; }
      .hero-name { font-size: clamp(44px, 14vw, 72px); }
      .carousel-buttons { display: none; }
      .section-sub { display: none; }
      .footer { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <div class="shell">

    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">GdO</div>
        <div class="brand-text">
          <div class="brand-eyebrow">Personale</div>
          <h1 class="brand-title">Goffredo d'Onofrio</h1>
        </div>
      </div>
      <div class="clock-box" role="status" aria-live="polite">
        <div class="clock-time" id="clock">--:--</div>
        <div class="clock-sub" id="date">--</div>
      </div>
    </header>

    <section class="hero" aria-label="Intestazione">
      <div class="hero-label">Dashboard</div>
      <h2 class="hero-name">Spazio<br><span>personale</span></h2>
    </section>

    <div class="section-head">
      <span class="section-num">01</span>
      <h3 class="section-title">Progetti</h3>
      <span class="section-sub">Accessi rapidi ai moduli già presenti</span>
    </div>

    <div class="carousel-shell">
      <div class="carousel-controls">
        <div class="carousel-meta" id="projectsMeta">--</div>
        <div class="carousel-buttons">
          <button class="carousel-btn" type="button" id="projectsPrev">← Prev</button>
          <button class="carousel-btn" type="button" id="projectsNext">Next →</button>
        </div>
      </div>
      <div class="carousel-window" id="projectsWindow">
        <div class="carousel-track" id="projectsTrack"></div>
      </div>
      <div class="carousel-dots" id="projectsDots"></div>
    </div>

    <footer class="footer">
      <span class="footer-dot"></span>
      <span id="footer-year">2026</span>
    </footer>
  </div>

  <script>
    /* clock */
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').textContent = now.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
      document.getElementById('date').textContent = now.toLocaleDateString('it-IT', { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' });
    }
    updateClock();
    setInterval(updateClock, 1000);

    /* cards */
    const isMobile = window.matchMedia('(max-width: 680px)').matches;

    const projectCards = [
      `<a class="project-card accent-blue" href="plancia-rocciamelone.html">
        <div class="card-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
            <path d="M8.5 7.5Q12 4 15.5 7.5"/>
            <path d="M6.5 6Q12 1 17.5 6"/>
          </svg>
        </div>
        <div class="card-top">
          <div class="card-tags">
            <span class="card-tag">Home</span>
            <span class="card-tag">Smart</span>
          </div>
          <p class="card-name">Smart<br>Home</p>
        </div>
        <div class="card-bottom">
          <div class="card-cta">Apri progetto →</div>
        </div>
      </a>`,

      `<a class="project-card accent-amber" href="cockpit-salute.html">
        <div class="card-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
            <path d="M3 12h3l2-5 3 9 2-4h3"/>
          </svg>
        </div>
        <div class="card-top">
          <div class="card-tags">
            <span class="card-tag">Salute</span>
            <span class="card-tag">Cockpit</span>
          </div>
          <p class="card-name">Cockpit<br>Salute</p>
        </div>
        <div class="card-bottom">
          <div class="card-cta">Apri progetto →</div>
        </div>
      </a>`
    ];

    function makeGroups(items, size) {
      const groups = [];
      for (let i = 0; i < items.length; i += size) groups.push(items.slice(i, i + size));
      return groups;
    }
    function mobileify(slides) {
      return slides.map(group => group.map(x => [x])).flat();
    }

    function setupCarousel(trackId, windowId, metaId, prevId, nextId, dotsId, items) {
      const track = document.getElementById(trackId);
      const viewport = document.getElementById(windowId);
      const meta = document.getElementById(metaId);
      const dots = document.getElementById(dotsId);
      const baseSlides = makeGroups(items, 3);
      const slides = isMobile ? mobileify(baseSlides) : baseSlides;
      let index = 0;
      let startX = 0;
      let dragOffset = 0;
      let dragging = false;

      function build() {
        track.innerHTML = '';
        slides.forEach(group => {
          const slide = document.createElement('div');
          slide.className = 'carousel-slide';
          const grid = document.createElement('div');
          grid.className = 'slide-grid';
          group.forEach(item => {
            const value = Array.isArray(item) ? item[0] : item;
            const holder = document.createElement('div');
            holder.innerHTML = value;
            grid.appendChild(holder.firstElementChild);
          });
          slide.appendChild(grid);
          track.appendChild(slide);
        });
        dots.innerHTML = '';
        slides.forEach((_, i) => {
          const dot = document.createElement('button');
          dot.className = 'carousel-dot';
          dot.type = 'button';
          dot.addEventListener('click', () => { index = i; dragOffset = 0; update(true); });
          dots.appendChild(dot);
        });
      }

      function update(animated = true) {
        viewport.classList.toggle('dragging', !animated);
        track.classList.toggle('is-dragging', !animated);
        track.style.transition = animated ? 'transform .35s cubic-bezier(.22,.8,.36,1)' : 'none';
        track.style.transform = `translate3d(calc(-${index * 100}% + ${dragOffset}px),0,0)`;
        meta.textContent = `${String(index + 1).padStart(2, '0')} / ${String(slides.length).padStart(2, '0')}`;
        [...dots.children].forEach((dot, i) => dot.classList.toggle('active', i === index));
      }

      function goPrev() { index = (index - 1 + slides.length) % slides.length; dragOffset = 0; update(true); }
      function goNext() { index = (index + 1) % slides.length; dragOffset = 0; update(true); }

      document.getElementById(prevId).onclick = goPrev;
      document.getElementById(nextId).onclick = goNext;

      const startDrag = (clientX) => { dragging = true; startX = clientX; dragOffset = 0; update(false); };
      const moveDrag = (clientX) => { if (!dragging) return; dragOffset = clientX - startX; update(false); };
      const endDrag = (clientX) => {
        if (!dragging) return;
        const diff = clientX - startX;
        dragging = false;
        if (Math.abs(diff) > 50) {
          if (diff < 0) index = (index + 1) % slides.length;
          else index = (index - 1 + slides.length) % slides.length;
        }
        dragOffset = 0;
        update(true);
      };

      viewport.addEventListener('mousedown', e => startDrag(e.clientX));
      window.addEventListener('mousemove', e => moveDrag(e.clientX));
      window.addEventListener('mouseup', e => endDrag(e.clientX));
      viewport.addEventListener('mouseleave', e => { if (dragging) endDrag(e.clientX); });
      viewport.addEventListener('touchstart', e => startDrag(e.changedTouches[0].clientX), { passive: true });
      viewport.addEventListener('touchmove', e => moveDrag(e.changedTouches[0].clientX), { passive: true });
      viewport.addEventListener('touchend', e => endDrag(e.changedTouches[0].clientX), { passive: true });
      viewport.addEventListener('touchcancel', () => { dragging = false; dragOffset = 0; update(true); }, { passive: true });

      build();
      update(true);
    }

    setupCarousel('projectsTrack', 'projectsWindow', 'projectsMeta', 'projectsPrev', 'projectsNext', 'projectsDots', projectCards);
  </script>
</body>
</html>
