<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>8xmille · Io, ci credo.</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F0F0F0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="8xmille">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icona-180.png">
<link rel="icon" type="image/png" href="icona-192.png">
<style>
body { box-sizing: border-box; padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); }
@media (display-mode: standalone) { body { background: #F0F0F0 !important; } }
</style>
</head>
<body>


<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300..700;1,8..60,300..700&amp;family=Mrs+Saint+Delafield&amp;display=swap">
<style>
/* Una sola schermata: il telefono al centro, scalato per entrare nello schermo; su telefono l'app occupa tutto. */
:root {
  --ground: #1E1D1C;
  --bezel: #0D0D0D;
  --ink: #F2F0EE;
  --muted: #9A9590;
  --brand: #FF6501;
  --app: #F0F0F0;
  --serif: 'Source Serif 4', Georgia, serif;
  --sans: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; overflow: hidden; background: var(--ground); color: var(--ink); font-family: var(--sans); }
#stage { position: relative; height: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; }
#phone { flex: none; width: 390px; height: 844px; overflow: hidden; background: var(--app); transform-origin: center center; }
.wide #phone { border-radius: 40px; box-shadow: 0 0 0 10px var(--bezel), 0 40px 90px rgba(0, 0, 0, .55); }
.side { display: none; position: absolute; left: 32px; max-width: 250px; }
.wide .side { display: block; }
.side--top { top: 26px; font-size: 14px; letter-spacing: .06em; text-transform: uppercase; }
.side--bottom { bottom: 28px; display: none; font-size: 13px; line-height: 1.5; color: var(--muted); }
.wide .side--bottom { display: flex; flex-direction: column; gap: 10px; }
.side--bottom strong { font-family: var(--serif); font-weight: 400; font-size: 26px; line-height: 1.05; color: var(--ink); }
#phone button:focus-visible, #phone a:focus-visible, #phone label:focus-within { outline: 2px solid var(--brand); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { #phone * { transition-duration: 0s !important; } }
</style>

<div id="stage">
  <div class="side side--top">App</div>
  <div class="side side--bottom"><strong>Io, ci credo.</strong><span>L’app 8xmille della Chiesa Cattolica. Tocca e scorri come su un telefono.</span></div>
  <div id="phone"></div>
</div>

<template id="tpl-Main">
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #F0F0F0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; color: #161616; -webkit-font-smoothing: antialiased">

<!-- HEADER -->
<sc-if value="{{is.header}}" hint-placeholder-val="{{true}}">
<header style="position: absolute; left: 0; right: 0; top: 0; height: 100px; z-index: 5; background: #F0F0F0; display: flex; align-items: center; justify-content: space-between; padding: 0 16px 0 26px; box-sizing: border-box">
<button onClick="{{h.home}}" aria-label="Home" style="display: block; width: 58px; height: 58px; padding: 0; border: 0; background: none; cursor: pointer"><img src="{{A.logo}}" alt="8xmille Chiesa Cattolica" style="display: block; width: 58px; height: 58px"></button>
<button onClick="{{h.openMenu}}" aria-label="Apri il menu" style="width: 50px; height: 50px; padding: 0 4px 0 0; border: 0; background: none; cursor: pointer; display: flex; flex-direction: column; align-items: flex-end; justify-content: center; gap: 10px">
<span style="display: block; width: 34px; height: 1.6px; background: #FF6501"></span>
<span style="display: block; width: 34px; height: 1.6px; background: #FF6501"></span>
<span style="display: block; width: 34px; height: 1.6px; background: #FF6501"></span>
</button>
</header>
</sc-if>

<!-- SPLASH -->
<sc-if value="{{is.splash}}" hint-placeholder-val="{{false}}">
<button onClick="{{h.skipSplash}}" aria-label="Entra nell’app" style="position: absolute; left: 0; top: 0; z-index: 20; display: block; width: 390px; height: 844px; padding: 0; border: 0; background: #FF6501; cursor: pointer">
<img src="{{A.splash}}" alt="8xmille Chiesa Cattolica" style="display: block; width: 390px; height: 844px; object-fit: cover">
</button>
</sc-if>

<!-- HOME -->
<sc-if value="{{is.home}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; left: 0; right: 0; top: 100px; bottom: 0; background: #F0F0F0; opacity: {{fx.op}}; transform: translateY({{fx.ty}}px); transition: opacity .32s ease, transform .32s cubic-bezier(.2,.7,.2,1)">
<div style="position: absolute; left: 0; right: 0; top: 0; bottom: 0; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; padding-bottom: {{homePad}}px; box-sizing: border-box">
<img src="{{A.hero}}" alt="Io, ci credo. Destina il tuo 8xmille alla Chiesa Cattolica. Sosteniamo le persone nei momenti più difficili. Aiutaci a fare sempre di più." style="display: block; width: 390px; height: 493px; object-fit: cover">

<div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 34px 26px 16px">
<div>
<div style="font-family: 'Source Serif 4', Georgia, serif; font-size: 17px; color: #FF6501">News</div>
<h2 style="margin: 2px 0 0; font-family: 'Source Serif 4', Georgia, serif; font-weight: 400; font-size: 29px; line-height: 1.05; color: #2E2E2E">Un gesto concreto.</h2>
</div>
<button onClick="{{h.goNews}}" style="flex: none; height: 36px; padding: 0; border: 0; background: none; cursor: pointer; font-size: 11.5px; letter-spacing: .8px; text-transform: uppercase; color: #C24E00">Vedi tutte</button>
</div>
<div style="display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; padding: 0 26px 4px; scroll-snap-type: x mandatory; scroll-padding: 26px">
<sc-for list="{{gesti}}" as="g" hint-placeholder-count="6">
<button onClick="{{g.open}}" style="flex: none; width: 148px; padding: 0; border: 0; background: none; text-align: left; cursor: pointer; scroll-snap-align: start">
<img src="{{g.img}}" alt="{{g.alt}}" style="display: block; width: 148px; height: 185px; object-fit: cover">
<span style="display: block; margin-top: 8px; font-family: 'Source Serif 4', Georgia, serif; font-size: 14.5px; line-height: 1.25; color: #222222">{{g.title}}</span>
</button>
</sc-for>
</div>

<div style="margin: 36px 26px 0; border-top: 1px solid #A6A6A6">
<button onClick="{{h.goOggi}}" style="width: 100%; display: flex; align-items: center; gap: 14px; padding: 14px 0; border: 0; border-bottom: 1px solid #A6A6A6; background: none; text-align: left; cursor: pointer">
<span style="flex: none; width: 40px; height: 40px; border-radius: 50%; background: #FF6501; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700">12</span>
<span style="flex: 1; min-width: 0">
<span style="display: block; font-family: 'Source Serif 4', Georgia, serif; font-size: 17px; color: #161616">Oggi, lunedì 12 ottobre</span>
<span style="display: block; margin-top: 2px; font-size: 12.5px; color: #555555">XXVIII settimana del Tempo Ordinario</span>
</span>
<svg width="9" height="15" viewBox="0 0 9 15" fill="none" aria-hidden="true"><path d="M1.5 1.5l6 6-6 6" stroke="#8A8A8A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</button>
<div style="display: flex; align-items: center; gap: 14px; padding: 12px 0; border-bottom: 1px solid #A6A6A6">
<button onClick="{{h.playMariano}}" aria-label="{{home.playLabel}}" style="flex: none; width: 40px; height: 40px; border-radius: 50%; border: 0; padding: 0; background: {{home.playBg}}; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background .2s">
<sc-if value="{{home.isPlay}}" hint-placeholder-val="{{true}}"><svg width="12" height="13" viewBox="0 0 12 13" aria-hidden="true"><path d="M2 1.2v10.6L11 6.5z" fill="#FFFFFF"></path></svg></sc-if>
<sc-if value="{{home.isPause}}" hint-placeholder-val="{{false}}"><svg width="12" height="13" viewBox="0 0 12 13" aria-hidden="true"><path d="M2.5 1.5v10M9.5 1.5v10" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"></path></svg></sc-if>
</button>
<button onClick="{{h.openMariano}}" style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; padding: 0; border: 0; background: none; text-align: left; cursor: pointer">
<span style="flex: 1; min-width: 0">
<span style="display: block; font-family: 'Source Serif 4', Georgia, serif; font-size: 17px; color: #161616">Rosario Mariano</span>
<span style="display: block; margin-top: 2px; font-size: 12.5px; color: #555555">Il lunedì: misteri Gaudiosi</span>
</span>
<svg width="9" height="15" viewBox="0 0 9 15" fill="none" aria-hidden="true"><path d="M1.5 1.5l6 6-6 6" stroke="#8A8A8A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</button>
</div>
</div>

<div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 38px 26px 16px">
<div>
<div style="font-family: 'Source Serif 4', Georgia, serif; font-size: 17px; color: #FF6501">Community</div>
<h2 style="margin: 2px 0 0; font-family: 'Source Serif 4', Georgia, serif; font-weight: 400; font-size: 29px; line-height: 1.05; color: #2E2E2E">Le vostre preghiere</h2>
</div>
<button onClick="{{h.goPreghiere}}" style="flex: none; height: 36px; padding: 0; border: 0; background: none; cursor: pointer; font-size: 11.5px; letter-spacing: .8px; text-transform: uppercase; color: #C24E00">Vedi tutte</button>
</div>
<div style="display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; padding: 0 26px 4px; scroll-snap-type: x mandatory; scroll-padding: 26px">
<button onClick="{{h.goComponi}}" style="flex: none; width: 148px; height: 185px; padding: 18px 16px; box-sizing: border-box; border: 0; background: #FF6501; color: #FFFFFF; text-align: left; cursor: pointer; display: flex; flex-direction: column; justify-content: space-between; scroll-snap-align: start">
<span style="width: 38px; height: 38px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M3 15l1-4 8.5-8.5a2.1 2.1 0 0 1 3 3L7 14l-4 1z" stroke="#FF6501" stroke-width="1.6" stroke-linejoin="round"></path></svg></span>
<span style="font-family: 'Source Serif 4', Georgia, serif; font-size: 21px; line-height: 1.1">Lascia la tua preghiera</span>
</button>
<sc-for list="{{homePrayers}}" as="p" hint-placeholder-count="4">
<button onClick="{{p.share}}" style="flex: none; width: 148px; padding: 0; border: 0; background: none; cursor: pointer; scroll-snap-align: start">
<img src="{{p.img}}" alt="{{p.alt}}" style="display: block; width: 148px; height: 185px; object-fit: cover">
</button>
</sc-for>
</div>

<div style="margin-top: 40px; background: #1F1F1F; padding: 30px 26px; display: flex; gap: 18px; align-items: center">
<img src="{{A.etu}}" alt="8xmille: un gesto concreto. Io, ci credo. E tu?" style="flex: none; display: block; width: 128px; height: 160px; object-fit: cover">
<div style="flex: 1; min-width: 0">
<div style="font-family: 'Source Serif 4', Georgia, serif; font-size: 28px; line-height: 1.05; color: #FFFFFF">Io, ci credo.<br>E tu?</div>
<div style="margin-top: 8px; font-size: 13px; line-height: 1.4; color: #D0D0D0">Condividi la tua scelta con chi ami.</div>
<button onClick="{{h.goCondividi}}" style="margin-top: 14px; height: 42px; padding: 0 18px; border: 0; background: #FF6501; color: #FFFFFF; font-size: 12.5px; letter-spacing: .6px; text-transform: uppercase; cursor: pointer">Condividi</button>
</div>
</div>
<div style="display: flex; align-items: center; gap: 12px; padding: 24px 26px 8px; font-size: 12px; color: #5A5A5A">
<img src="{{A.logo}}" alt="" style="display: block; width: 30px; height: 30px">
<span>8xmille.it · Chiesa Cattolica</span>
</div>
</div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; background: #FFFFFF; padding: 9px 14px 15px">
<button onClick="{{h.cta}}" style="display: block; width: 100%; height: 62px; border: 0; background: #FF6501; color: #FFFFFF; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 16.5px; letter-spacing: .2px; text-transform: uppercase; cursor: pointer">{{home.cta}}</button>
</div>
</div>
</sc-if>

<!-- COME FIRMARE: 4 PASSI -->
<sc-if value="{{is.passi}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; left: 0; right: 0; top: 100px; bottom: 0; background: linear-gradient(180deg, #E6E6E6 0px, #EFEFEF 60px, #F2F2F2 100%); opacity: {{fx.op}}; transform: translateY({{fx.ty}}px); transition: opacity .32s ease, transform .32s cubic-bezier(.2,.7,.2,1)">
<div style="position: absolute; left: 0; right: 0; top: 0; bottom: 0; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; padding-bottom: {{pad}}px; box-sizing: border-box">
<div style="padding: 26px 26px 0">
<h1 style="margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-weight: 400; font-size: 32px; line-height: 1.02; letter-spacing: -.2px; color: #3A3A3A">Come firmare<br><span style="color: #FF6501">l’8xmille in 4 passi</span></h1>
</div>
<div style="margin: 18px 26px 0; display: flex; align-items: center; gap: 12px">
<div style="flex: 1; height: 3px; background: #D6D6D6; overflow: hidden"><div style="height: 3px; width: {{passi.pct}}%; background: #FF6501; transition: width .45s cubic-bezier(.2,.8,.2,1)"></div></div>
<div style="font-size: 11.5px; letter-spacing: .6px; text-transform: uppercase; color: #555555">{{passi.count}} di 4</div>
</div>
<div style="margin: 14px 26px 0; border-top: 1px solid #9C9C9C">
<sc-for list="{{steps}}" as="st" hint-placeholder-count="4">
<div style="display: flex; gap: 14px; align-items: flex-start; padding: 16px 0 18px; border-bottom: 1px solid #9C9C9C">
<div style="flex: none; width: 42px; height: 37px; background: #FF6501; color: #FFFFFF; font-size: 29px; font-weight: 300; line-height: 37px; text-align: center; letter-spacing: -.5px">{{st.n}}</div>
<div style="flex: 1; min-width: 0; padding-top: 1px">
<div style="font-family: 'Source Serif 4', Georgia, serif; font-size: 19px; line-height: 1.2; color: #161616">{{st.t}}</div>
<sc-if value="{{st.links}}" hint-placeholder-val="{{false}}">
<div style="margin-top: 5px; font-family: 'Source Serif 4', Georgia, serif; font-size: 15px; line-height: 1.45; color: #2A2A2A">Completa il tuo <button onClick="{{h.m730}}" style="padding: 0; border: 0; background: none; cursor: pointer; font-family: 'Source Serif 4', Georgia, serif; font-size: 15px; font-weight: 600; color: #E25800; text-decoration: underline; text-underline-offset: 2px">Modello 730</button>, <button onClick="{{h.mRedditi}}" style="padding: 0; border: 0; background: none; cursor: pointer; font-family: 'Source Serif 4', Georgia, serif; font-size: 15px; font-weight: 600; color: #E25800; text-decoration: underline; text-underline-offset: 2px">Modello Redditi</button> o <button onClick="{{h.mCU}}" style="padding: 0; border: 0; background: none; cursor: pointer; font-family: 'Source Serif 4', Georgia, serif; font-size: 15px; font-weight: 600; color: #E25800; text-decoration: underline; text-underline-offset: 2px">Modello CU</button>.</div>
</sc-if>
<sc-if value="{{st.plain}}" hint-placeholder-val="{{true}}">
<div style="margin-top: 5px; font-family: 'Source Serif 4', Georgia, serif; font-size: 15px; line-height: 1.45; color: #2A2A2A; white-space: pre-line">{{st.d}}</div>
</sc-if>
</div>
<button onClick="{{st.toggle}}" aria-label="{{st.label}}" aria-pressed="{{st.pressed}}" style="flex: none; width: 34px; height: 34px; margin-top: 2px; border-radius: 50%; border: 0; padding: 0; background: {{st.bg}}; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background .2s ease">
<svg width="15" height="12" viewBox="0 0 15 12" fill="none" aria-hidden="true"><path d="M1.5 6.5l4 4 8-9" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</button>
</div>
</sc-for>
</div>
<div style="padding: 22px 26px 0">
<button onClick="{{h.firmato}}" style="display: block; width: 100%; height: 58px; border: 0; background: #FF6501; color: #FFFFFF; font-size: 15px; letter-spacing: .5px; text-transform: uppercase; cursor: pointer">{{passi.btn}}</button>
<div style="margin-top: 10px; font-size: 12.5px; line-height: 1.45; color: #555555; text-align: center">{{passi.hint}}</div>
</div>
<div style="padding: 40px 26px 0">
<h2 style="margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-weight: 400; font-size: 25px; color: #2E2E2E">Quale modello usi?</h2>
<p style="margin: 10px 0 0; font-family: 'Source Serif 4', Georgia, serif; font-size: 15.5px; line-height: 1.42; color: #161616">Ci sono diversi modi per presentare la dichiarazione dei redditi e alcune persone non sono obbligate a presentarla. Ma lo Stato garantisce a tutti di poter indicare a chi far gestire le risorse dell’8xmille. Nel nostro caso, alla Chiesa cattolica.</p>
<div style="display: flex; flex-direction: column; gap: 6px; margin-top: 18px">
<button onClick="{{h.m730}}" style="height: 50px; border: 0; background: #FF6501; color: #FFFFFF; font-size: 14px; font-weight: 600; letter-spacing: .3px; text-transform: uppercase; cursor: pointer">Modello 730</button>
<button onClick="{{h.mRedditi}}" style="height: 50px; border: 0; background: #FF6501; color: #FFFFFF; font-size: 14px; font-weight: 600; letter-spacing: .3px; text-transform: uppercase; cursor: pointer">Modello Redditi</button>
<button onClick="{{h.mCU}}" style="height: 50px; border: 0; background: #FF6501; color: #FFFFFF; font-size: 14px; font-weight: 600; letter-spacing: .3px; text-transform: uppercase; cursor: pointer">Modello CU</button>
</div>
<div style="margin-top: 24px; font-size: 11.5px; letter-spacing: .6px; text-transform: uppercase; color: #C24E00">Chi può firmare</div>
<p style="margin: 6px 0 0; font-family: 'Source Serif 4', Georgia, serif; font-size: 15.5px; line-height: 1.42; color: #3A3A3A">Possono sostenere la Chiesa con l’8xmille tutte le persone che hanno un reddito e presentano la dichiarazione, ma anche chi riceve solo la Certificazione Unica e non è obbligato a presentarla.</p>
</div>
<div style="position: relative; margin-top: 36px; width: 390px; height: 473px; overflow: hidden">
<img src="{{A.aiuto}}" alt="Hai bisogno di aiuto? Per maggiori informazioni" style="display: block; width: 390px; height: 473px; object-fit: cover; object-position: top">
<button onClick="{{h.numeroVerde}}" style="position: absolute; left: 25px; top: 177px; width: 340px; height: 82px; border-radius: 41px; border: 0; background: #ECECEC; color: #111111; font-size: 15.5px; font-weight: 700; letter-spacing: .2px; text-transform: uppercase; cursor: pointer">Chiama il numero verde</button>
<a href="https://www.8xmille.it" target="_blank" rel="noopener" style="position: absolute; left: 25px; top: 262.5px; width: 340px; height: 82px; border-radius: 41px; background: #ECECEC; color: #111111; font-size: 15.5px; font-weight: 700; letter-spacing: .2px; text-transform: uppercase; text-decoration: none; display: flex; align-items: center; justify-content: center">Visita il sito</a>
<button onClick="{{h.mail}}" style="position: absolute; left: 25px; top: 348px; width: 340px; height: 82px; border-radius: 41px; border: 0; background: #ECECEC; color: #111111; font-size: 15.5px; font-weight: 700; letter-spacing: .2px; text-transform: uppercase; cursor: pointer">Scrivici via mail</button>
</div>
</div>
</div>
</sc-if>

<!-- MODELLO 730 / REDDITI / CU -->
<sc-if value="{{is.modello}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; left: 0; right: 0; top: 100px; bottom: 0; background: linear-gradient(180deg, #E6E6E6 0px, #EFEFEF 60px, #F2F2F2 100%); opacity: {{fx.op}}; transform: translateY({{fx.ty}}px); transition: opacity .32s ease, transform .32s cubic-bezier(.2,.7,.2,1)">
<div style="position: absolute; left: 0; right: 0; top: 0; bottom: 0; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; padding-bottom: {{pad}}px; box-sizing: border-box">
<div style="padding: 20px 26px 0">
<button onClick="{{h.back}}" style="display: flex; align-items: center; gap: 6px; height: 32px; padding: 0; border: 0; background: none; cursor: pointer; font-family: 'Source Serif 4', Georgia, serif; font-size: 17px; color: #FF6501"><svg width="9" height="15" viewBox="0 0 9 15" fill="none" aria-hidden="true"><path d="M7.5 1.5l-6 6 6 6" stroke="#FF6501" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>Indietro</button>
<h1 style="margin: 8px 0 0; font-family: 'Source Serif 4', Georgia, serif; font-weight: 400; font-size: 29px; line-height: 1.03; color: #3A3A3A">Come firmare<br><span style="color: #FF6501">l’8xmille in 4 passi</span></h1>
<div style="display: flex; gap: 22px; margin-top: 20px; border-bottom: 1px solid #A6A6A6">
<sc-for list="{{mtabs}}" as="t" hint-placeholder-count="3">
<button onClick="{{t.pick}}" aria-pressed="{{t.on}}" style="margin-bottom: -1px; padding: 0 0 9px; border: 0; border-bottom: 2px solid {{t.line}}; background: none; cursor: pointer; font-family: 'Source Serif 4', Georgia, serif; font-size: 16px; color: {{t.color}}">{{t.label}}</button>
</sc-for>
</div>
<h2 style="margin: 22px 0 0; font-family: 'Source Serif 4', Georgia, serif; font-weight: 400; font-size: 29px; color: #222222">{{mod.title}}</h2>
<sc-for list="{{mod.blocks}}" as="b" hint-placeholder-count="6">

<p style="margin: 10px 0 0; font-family: 'Source Serif 4', Georgia, serif; font-size: 15.5px; line-height: 1.42; color: #3A3A3A">Le foto e le parole della community nel frame «Io, ci credo.».</p>

</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; padding: 22px 20px 0">
<sc-for list="{{wallMine}}" as="m" hint-placeholder-count="0">
<button onClick="{{m.share}}" style="position: relative; display: block; padding: 0; border: 0; background: none; cursor: pointer">
<dc-import name="Frame" foto="{{m.photo}}" w="172" h="215" hint-size="172px,215px"></dc-import>
<span style="position: absolute; left: 8px; bottom: 8px; padding: 3px 6px; background: #FF6501; color: #FFFFFF; font-size: 10px; letter-spacing: .6px; text-transform: uppercase">Tu</span>

</sc-for>
<sc-for list="{{wallItems}}" as="w" hint-placeholder-count="9">
<button onClick="{{w.share}}" style="display: block; padding: 0; border: 0; background: none; cursor: pointer"><img src="{{w.img}}" alt="{{w.alt}}" style="display: block; width: 100%; height: 215px; object-fit: cover"></button>
</sc-for>
</div>
</div>
</div>
</sc-if>

<!-- GRAZIE -->

<div aria-hidden="true" style="position: absolute; left: -70px; top: {{gz.o1}}px; width: 320px; height: 320px; border-radius: 50%; background: radial-gradient(circle, rgba(200,202,244,.85) 0%, rgba(200,202,244,0) 68%); transition: top 1.6s cubic-bezier(.2,.7,.2,1)"></div>
<div aria-hidden="true" style="position: absolute; right: -80px; top: {{gz.o2}}px; width: 280px; height: 280px; border-radius: 50%; background: radial-gradient(circle, rgba(240,150,240,.8) 0%, rgba(240,150,240,0) 66%); transition: top 1.9s cubic-bezier(.2,.7,.2,1)"></div>
<div aria-hidden="true" style="position: absolute; left: 230px; top: {{gz.o3}}px; width: 120px; height: 120px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.75) 0%, rgba(255,255,255,0) 66%); transition: top 2.2s cubic-bezier(.2,.7,.2,1)"></div>

<p style="margin: 14px 0 0; font-family: 'Source Serif 4', Georgia, serif; font-style: italic; font-size: 21px; color: #FFFFFF">La tua firma dice chi sei.</p>
</div>
<div style="position: absolute; left: 70px; top: {{gz.cardTop}}px; transform: rotate(-4deg); box-shadow: 0 30px 50px rgba(90,25,0,.35); transition: top .9s cubic-bezier(.2,.8,.2,1)">
<dc-import name="Tessera" nome="{{v.nome}}" w="250" hint-size="250px,312px"></dc-import>
</div>
<div style="position: absolute; left: 28px; right: 28px; top: 596px">
<label for="firma-tessera" style="display: block; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: #FFFFFF">Firma la tua tessera</label>
<input id="firma-tessera" value="{{v.nome}}" onChange="{{h.setNome}}" placeholder="Il tuo nome" style="display: block; width: 100%; height: 42px; box-sizing: border-box; margin-top: 4px; padding: 0; border: 0; border-bottom: 1px solid rgba(255,255,255,.85); border-radius: 0; background: transparent; color: #FFFFFF; font-family: 'Source Serif 4', Georgia, serif; font-size: 20px; outline: none">
</div>
<div style="position: absolute; left: 28px; right: 28px; bottom: 30px; display: flex; flex-direction: column; gap: 10px">
<button onClick="{{h.shareTessera}}" style="height: 54px; border: 0; background: #FFFFFF; color: #D44C00; font-size: 14.5px; font-weight: 600; letter-spacing: .6px; text-transform: uppercase; cursor: pointer">Condividi la tua scelta</button>
<button onClick="{{h.storieFromGrazie}}" style="height: 50px; border: 1px solid rgba(255,255,255,.9); background: transparent; color: #FFFFFF; font-size: 13.5px; letter-spacing: .6px; text-transform: uppercase; cursor: pointer">Scopri cosa rende possibile</button>
</div>
</div>
</sc-if>

<!-- CHAT: MESSAGGIO CONDIVISIBILE -->
<sc-if value="{{is.chat}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; z-index: 20; background: #ECE8E1; opacity: {{fx.op}}; transition: opacity .3s ease">
<div style="position: absolute; left: 0; right: 0; top: 0; height: 92px; box-sizing: border-box; background: #F0F0F0; border-bottom: 1px solid #D8D8D8; display: flex; align-items: flex-end; gap: 10px; padding: 0 16px 12px 6px">
<button onClick="{{h.back}}" aria-label="Indietro" style="width: 40px; height: 44px; padding: 0; border: 0; background: none; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="11" height="19" viewBox="0 0 11 19" fill="none" aria-hidden="true"><path d="M9.5 1.5l-8 8 8 8" stroke="#FF6501" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
<span style="flex: none; width: 42px; height: 42px; border-radius: 50%; background: #1F1F1F; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: 'Source Serif 4', Georgia, serif; font-size: 18px">F</span>
<div style="flex: 1; min-width: 0; padding-bottom: 2px">
<div style="font-size: 16px; font-weight: 600; color: #161616">Famiglia</div>
<div style="margin-top: 1px; font-size: 12px; color: #6A6A6A">{{chat.status}}</div>
</div>
</div>
<div style="position: absolute; left: 0; right: 0; top: 92px; bottom: 72px; overflow-y: auto; scrollbar-width: none; padding: 14px 12px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px">
<div style="align-self: center; padding: 4px 10px; background: #FFFFFF; border-radius: 8px; font-size: 11.5px; color: #555555">Oggi</div>
<div style="display: flex; justify-content: flex-end">
<div style="max-width: 274px; padding: 5px; background: #FFE4D0; border-radius: 14px 14px 4px 14px; box-shadow: 0 1px 1px rgba(0,0,0,.08)">

<sc-if value="{{chat.isTessera}}" hint-placeholder-val="{{false}}"><div style="width: 264px; height: 330px; border-radius: 10px; background: #F3D3BC; display: flex; align-items: center; justify-content: center"><div style="transform: rotate(-3deg); box-shadow: 0 14px 24px rgba(0,0,0,.18)"><dc-import name="Tessera" nome="{{v.nome}}" w="200" hint-size="200px,250px"></dc-import></div></div></sc-if>
<sc-if value="{{chat.isPrayer}}" hint-placeholder-val="{{false}}"><div style="border-radius: 10px; overflow: hidden"><dc-import name="Preghiera" testo="{{chat.pText}}" firma="{{chat.pFirma}}" sfondo="{{chat.pImg}}" colore="{{chat.pColor}}" w="264" hint-size="264px,330px"></dc-import></div></sc-if>
<sc-if value="{{chat.isFrame}}" hint-placeholder-val="{{false}}"><div style="border-radius: 10px; overflow: hidden"><dc-import name="Frame" foto="{{chat.frame}}" w="264" h="330" hint-size="264px,330px"></dc-import></div></sc-if>
<div style="padding: 8px 6px 2px; font-size: 14.5px; line-height: 1.38; color: #161616">Io, ci credo. E tu? Destina il tuo 8xmille alla Chiesa Cattolica: scopri come, passo dopo passo, su <span style="color: #B44A00; text-decoration: underline">8xmille.it</span></div>
<div style="display: flex; justify-content: flex-end; align-items: center; gap: 4px; padding: 0 6px 2px; font-size: 11px; color: #7A7A7A">12:04<svg width="16" height="10" viewBox="0 0 16 10" fill="none" aria-hidden="true"><path d="M1 5.5l3 3L10.5 1.5M6.5 8.5l1 0L15 1.5" stroke="#E25800" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"></path></svg></div>
</div>
</div>
<sc-if value="{{chat.typing}}" hint-placeholder-val="{{false}}">
<div style="display: flex"><div style="padding: 12px 16px; background: #FFFFFF; border-radius: 14px 14px 14px 4px; display: flex; gap: 5px"><span style="width: 7px; height: 7px; border-radius: 50%; background: #9A9A9A"></span><span style="width: 7px; height: 7px; border-radius: 50%; background: #B5B5B5"></span><span style="width: 7px; height: 7px; border-radius: 50%; background: #CFCFCF"></span></div></div>
</sc-if>
<sc-if value="{{chat.reply}}" hint-placeholder-val="{{false}}">
<div style="display: flex"><div style="max-width: 260px; padding: 8px 12px 6px; background: #FFFFFF; border-radius: 14px 14px 14px 4px; box-shadow: 0 1px 1px rgba(0,0,0,.08)">
<div style="font-size: 12.5px; font-weight: 700; color: #B44A00">Lucia</div>
<div style="margin-top: 2px; font-size: 14.5px; line-height: 1.38; color: #161616">Anch’io, ci credo. La firmo anche quest’anno.</div>
<div style="margin-top: 2px; text-align: right; font-size: 11px; color: #7A7A7A">12:06</div>
</div></div>
</sc-if>
</div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 72px; box-sizing: border-box; background: #F0F0F0; display: flex; align-items: center; gap: 10px; padding: 0 12px 8px">
<div style="flex: 1; height: 42px; border-radius: 21px; background: #FFFFFF; border: 1px solid #D8D8D8; display: flex; align-items: center; padding: 0 16px; font-size: 14px; color: #7A7A7A">Scrivi un messaggio</div>
<button onClick="{{h.chatDone}}" aria-label="Fatto, torna indietro" style="flex: none; width: 44px; height: 44px; border-radius: 50%; border: 0; padding: 0; background: #FF6501; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="16" height="13" viewBox="0 0 16 13" fill="none" aria-hidden="true"><path d="M1.5 7l4.5 4.5L14.5 1.5" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
</div>
</div>
</sc-if>

<!-- PHOTO FRAME -->
<sc-if value="{{is.camera}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; z-index: 20; background: #000000; opacity: {{fx.op}}; transition: opacity .3s ease">
<div style="position: absolute; left: 0; top: 0; width: 390px; height: 666px; overflow: hidden; border-radius: 0 0 18px 18px">
<dc-import name="Frame" foto="{{cam.photo}}" w="390" h="666" hint-size="390px,666px"></dc-import>
</div>
<button onClick="{{h.back}}" aria-label="Chiudi il photo frame" style="position: absolute; left: 8px; top: 10px; width: 44px; height: 44px; padding: 0; border: 0; background: none; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M2 2l16 16M18 2L2 18" stroke="#FFFFFF" stroke-width="1.8"></path></svg></button>
<div style="position: absolute; left: 60px; right: 60px; top: 22px; text-align: center; font-size: 11.5px; font-weight: 600; letter-spacing: 1.4px; text-transform: uppercase; color: #FFFFFF; text-shadow: 0 1px 6px rgba(0,0,0,.45)">Photo frame</div>
<sc-if value="{{cam.live}}" hint-placeholder-val="{{true}}">

<input type="file" accept="image/*" onChange="{{h.photo}}" aria-label="Scegli una foto dalla galleria" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer">
</label>
<button onClick="{{h.shoot}}" aria-label="Scatta" style="width: 80px; height: 80px; border-radius: 50%; border: 0; padding: 0; background: rgba(255,255,255,.32); display: flex; align-items: center; justify-content: center; cursor: pointer"><span style="display: block; width: 64px; height: 64px; border-radius: 50%; background: #FFFFFF"></span></button>
<label style="position: relative; width: 46px; height: 46px; border-radius: 50%; background: rgba(255,255,255,.14); display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="24" height="22" viewBox="0 0 24 22" fill="none" aria-hidden="true"><path d="M4 9a8 8 0 0 1 14.5-3.5M20 13a8 8 0 0 1-14.5 3.5" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round"></path><path d="M19 1.5v4.5h-4.5M5 20.5V16h4.5" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
<input type="file" accept="image/*" capture="user" onChange="{{h.photo}}" aria-label="Scatta un selfie con la fotocamera" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer">
</label>
</div>
<div style="position: absolute; left: 0; right: 0; top: 796px; display: flex; justify-content: center; gap: 22px; font-size: 12.5px; letter-spacing: 1.3px; text-transform: uppercase">
<span style="color: #8A8A8A">Storia</span><span style="color: #FFFFFF; font-weight: 600">Foto</span><span style="color: #8A8A8A">Post</span>
</div>
</sc-if>
<sc-if value="{{cam.shot}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; left: 20px; right: 20px; top: 686px; display: flex; flex-direction: column; gap: 8px">
<button onClick="{{h.publish}}" style="height: 54px; border: 0; background: #FF6501; color: #FFFFFF; font-size: 14.5px; letter-spacing: .5px; text-transform: uppercase; cursor: pointer">Pubblica sul Social Wall</button>
<div style="display: flex; gap: 8px">
<button onClick="{{h.retake}}" style="flex: 1; height: 48px; border: 1px solid rgba(255,255,255,.6); background: transparent; color: #FFFFFF; font-size: 13px; letter-spacing: .5px; text-transform: uppercase; cursor: pointer">Rifai</button>
<button onClick="{{h.shareFrame}}" style="flex: 1; height: 48px; border: 0; background: #FFFFFF; color: #161616; font-size: 13px; font-weight: 600; letter-spacing: .5px; text-transform: uppercase; cursor: pointer">Condividi</button>
</div>
</div>
</sc-if>
<div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; background: #FFFFFF; pointer-events: none; opacity: {{cam.flash}}; transition: {{cam.flashTr}}"></div>
</div>
</sc-if>

<!-- MINI PLAYER -->
<sc-if value="{{is.mini}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; left: 10px; right: 10px; bottom: {{mp.bottom}}px; z-index: 8; height: 64px; box-sizing: border-box; background: #FFFFFF; box-shadow: 0 8px 26px rgba(0,0,0,.16); display: flex; align-items: center; gap: 10px; padding: 0 6px 0 10px; overflow: hidden">
<div aria-hidden="true" style="position: absolute; left: 0; top: 0; height: 2px; width: {{mp.pct}}%; background: #FF6501; transition: width .5s linear"></div>

<span style="flex: none; width: 44px; height: 44px; background: #FF6501; display: flex; align-items: center; justify-content: center"><img src="{{A.rosario}}" alt="" style="width: 40px; height: 40px; object-fit: contain"></span>
<span style="flex: 1; min-width: 0">
<span style="display: block; font-family: 'Source Serif 4', Georgia, serif; font-size: 15.5px; color: #161616; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{mp.title}}</span>
<span style="display: block; margin-top: 2px; font-size: 11.5px; color: #555555; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{mp.sub}}</span>
</span>
</button>
<button onClick="{{h.toggleMini}}" aria-label="{{mp.label}}" style="flex: none; width: 42px; height: 42px; border-radius: 50%; border: 0; padding: 0; background: #FF6501; display: flex; align-items: center; justify-content: center; cursor: pointer">
<sc-if value="{{mp.isPause}}" hint-placeholder-val="{{true}}"><svg width="12" height="13" viewBox="0 0 12 13" aria-hidden="true"><path d="M2.5 1.5v10M9.5 1.5v10" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"></path></svg></sc-if>
<sc-if value="{{mp.isPlay}}" hint-placeholder-val="{{false}}"><svg width="12" height="13" viewBox="0 0 12 13" aria-hidden="true"><path d="M2 1.2v10.6L11 6.5z" fill="#FFFFFF"></path></svg></sc-if>

<button onClick="{{h.stopPlay}}" aria-label="Chiudi il player" style="flex: none; width: 36px; height: 44px; padding: 0; border: 0; background: none; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M1.5 1.5l9 9M10.5 1.5l-9 9" stroke="#8A8A8A" stroke-width="1.5"></path></svg></button>
</div>
</sc-if>

<!-- MENU -->

</sc-for>
</div>
<div style="position: absolute; left: 26px; right: 26px; bottom: 34px; font-size: 12px; line-height: 1.55; color: #5A5A5A">Destina il tuo 8xmille alla Chiesa Cattolica.<br>8xmille.it</div>
</nav>
</sc-if>

<script src="https://cdn.jsdelivr.net/npm/preact@10.19.3/dist/preact.umd.js"></script>
<script>
(function () {
  var P = window.preact;
  var h = P.h;
  var HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
  var WHOLE = /^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/;
  var REG = {};

  function look(path, scope) {
    path = path.trim();
    if (path === 'true') return true;
    if (path === 'false') return false;
    if (path === 'null') return null;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    var v = scope;
    var parts = path.split('.');
    for (var i = 0; i < parts.length; i++) { if (v == null) return undefined; v = v[parts[i]]; }
    return v;
  }
  function interp(str, scope) {
    var m = str.match(WHOLE);
    if (m) return look(m[1], scope);
    if (str.indexOf('{{') < 0) return str;
    return str.replace(HOLE, function (_, p) { var x = look(p, scope); return x == null ? '' : String(x); });
  }
  function camel(s) { return s.replace(/-([a-z])/g, function (_, c) { return c.toUpperCase(); }); }
  function kids(node, scope) {
    var out = [];
    node.childNodes.forEach(function (n) {
      var v = build(n, scope);
      if (Array.isArray(v)) out.push.apply(out, v); else if (v != null) out.push(v);
    });
    return out;
  }
  function build(n, scope) {
    if (n.nodeType === 3) {
      var t = n.nodeValue;
      if (!t.trim()) return t.indexOf('\n') >= 0 ? null : t;
      var r = interp(t, scope);
      return r == null ? '' : String(r);
    }
    if (n.nodeType !== 1) return null;
    var tag = n.localName;
    if (tag === 'sc-if') return interp(n.getAttribute('value') || '', scope) ? kids(n, scope) : null;
    if (tag === 'sc-for') {
      var list = interp(n.getAttribute('list') || '', scope) || [];
      var as = n.getAttribute('as') || 'item';
      var out = [];
      list.forEach(function (it, i) {
        var sc = Object.create(scope); sc[as] = it; sc.$index = i;
        out.push.apply(out, kids(n, sc));
      });
      return out;
    }
    if (tag === 'dc-import') {
      var C = REG[n.getAttribute('name')];
      var cp = {};
      Array.prototype.forEach.call(n.attributes, function (a) {
        if (a.name === 'name' || a.name.indexOf('hint-') === 0) return;
        cp[camel(a.name)] = interp(a.value, scope);
      });
      return C ? h(C, cp) : null;
    }
    var props = {};
    var type = (n.getAttribute('type') || '').toLowerCase();
    Array.prototype.forEach.call(n.attributes, function (a) {
      var name = a.name;
      if (name.indexOf('hint-') === 0) return;
      if (name === 'onchange' && (tag === 'textarea' || (tag === 'input' && !/^(checkbox|radio|file)$/.test(type)))) name = 'oninput';
      props[name] = interp(a.value, scope);
    });
    return h.apply(null, [tag, props].concat(kids(n, scope)));
  }

  class DCLogic extends P.Component {
    render() { return build(this._root, this.renderVals() || {}); }
  }
  window.DCLogic = DCLogic;
  function def(name, factory) {
    var C = factory();
    C.prototype._root = document.getElementById('tpl-' + name).content.firstElementChild;
    REG[name] = C;
  }

def('Main', function () {

class Component extends DCLogic {
  componentDidMount() {
    this._timers = [];
    if (this.S().screen === 'splash') {
      this.later(() => { if (this.S().screen === 'splash') this.go('home'); }, 2300);
    }
  }

  componentWillUnmount() {
    (this._timers || []).forEach((t) => clearTimeout(t));
    clearInterval(this._play);
  }

  later(fn, ms) {
    const t = setTimeout(fn, ms);
    (this._timers = this._timers || []).push(t);
    return t;
  }

  A() {
    return {
      logo: 'img/logo.jpg',
      hero: 'img/hero.jpg',
      splash: 'img/splash.jpg',
      aiuto: 'img/aiuto.jpg',
      faustina: 'img/faustina.jpg',
      racc1: 'img/racc1.jpg',
      racc2: 'img/racc2.jpg',
      racc3: 'img/racc3.jpg',
      racc4: 'img/racc4.jpg',
      rosario: 'img/rosario.png',
      selfie: 'img/selfie.jpg',
      quaderno: 'img/quaderno.jpg',
      shopper: 'img/shopper.jpg',
      etu: 'img/etu.jpg',
      gesto1: 'img/gesto1.jpg',
      gesto2: 'img/gesto2.jpg',
      gesto3: 'img/gesto3.jpg',
      gesto4: 'img/gesto4.jpg',
      gesto5: 'img/gesto5.jpg',
      gesto6: 'img/gesto6.jpg',
      credo1: 'img/credo1.jpg',
      credo2: 'img/credo2.jpg',
      credo3: 'img/credo3.jpg',
      credo4: 'img/credo4.jpg',
      credo5: 'img/credo5.jpg',
      credo6: 'img/credo6.jpg',
      preg1: 'img/preg1.jpg',
      preg2: 'img/preg2.jpg',
      preg3: 'img/preg3.jpg',
      wa1: 'img/wa1.jpg',
      wa2: 'img/wa2.jpg',
      wa3: 'img/wa3.jpg',
      wall1: 'img/wall1.jpg',
      wall2: 'img/wall2.jpg',
      wall3: 'img/wall3.jpg',
      wall4: 'img/wall4.jpg',
      wall5: 'img/wall5.jpg',
      wall6: 'img/wall6.jpg',
      wall7: 'img/wall7.jpg',
      bgBlu: 'img/bg_blu.jpg',
      bgChiesa: 'img/bg_chiesa.jpg',
      bgLuce: 'img/bg_luce.jpg'
    };
  }

  stato0() {
    return {
      screen: 'splash', hist: [], enter: 1,
      menu: false, menuIn: 0, menuPressed: null,
      firmato: false, nome: '',
      passi: [false, false, false, false],
      modello: '730', day: 12,
      rTab: 'tutti', favs: ['mariano', 'dolori', 'misericordia', 'spirito'], rosario: 'mariano',
      playing: null, paused: false, playPos: 0,
      story: null, storyFill: 0,
      sheet: null, sheetOn: 0,
      chatImg: null, chatTessera: false, chatPrayer: null, chatFrame: null, chatReply: 2,
      mine: [], compose: { text: '', firma: '', bg: 0, ok: false }, sent: false,
      pray: {}, reminder: false,
      photo: null, shot: false, flash: 0, flashTr: 'none', wallMine: [],
      toast: '', toastOn: 0
    };
  }

  preset(sc) {
    const A = this.A();
    const P = {
      splash: { screen: 'splash' },
      home: { screen: 'home' },
      menu: { screen: 'home', menu: true, menuIn: 1 },
      passi: { screen: 'passi' },
      modello: { screen: 'modello', modello: '730' },
      calendario: { screen: 'calendario', day: 5 },
      rosario: { screen: 'rosario', rTab: 'tutti' },
      preferiti: { screen: 'rosario', rTab: 'preferiti' },
      raccolte: { screen: 'rosario', rTab: 'raccolte' },
      mariano: { screen: 'rosarioDet', rosario: 'mariano' },
      grazie: { screen: 'grazie', firmato: true, nome: 'Chiara' },
      miafirma: { screen: 'miafirma', firmato: true, nome: 'Chiara', passi: [true, true, true, true] },
      news: { screen: 'news' },
      storie: { screen: 'news', story: 0, storyFill: 0.45 },
      preghiere: { screen: 'preghiere' },
      componi: { screen: 'componi', nome: 'Chiara', compose: { text: 'Signore, insegnami a vedere chi mi sta accanto.', firma: 'Chiara', bg: 0, ok: true } },
      condividi: { screen: 'condividi' },
      canali: { screen: 'condividi', sheet: { img: A.credo1, alt: 'Io, ci credo. Destina il tuo 8xmille alla Chiesa Cattolica.' }, sheetOn: 1 },
      whatsapp: { screen: 'chat', chatImg: A.wa3, chatReply: 2 },
      camera: { screen: 'camera' },
      scatto: { screen: 'camera', shot: true },
      wall: { screen: 'wall', wallMine: [A.selfie] }
    };
    return P[sc] || P.splash;
  }

  S() {
    return Object.assign(this.stato0(), this.preset(this.props.scene || 'splash'), this.state || {});
  }

  go(screen, extra) {
    const s = this.S();
    const keep = s.screen === 'splash' || s.screen === screen;
    const hist = keep ? s.hist : s.hist.concat([s.screen]).slice(-15);
    this.setState(Object.assign({ screen, hist, menu: false, menuIn: 0, menuPressed: null, enter: 0, sheet: null, sheetOn: 0, story: null }, extra || {}));
    this.later(() => this.setState({ enter: 1 }), 34);
    if (screen === 'chat') this.startChat();
  }

  back() {
    const s = this.S();
    const hist = s.hist.slice();
    const prev = hist.pop() || 'home';
    this.setState({ screen: prev, hist, enter: 0, menu: false, sheet: null, story: null, shot: false });
    this.later(() => this.setState({ enter: 1 }), 34);
  }

  toast(msg) {
    clearTimeout(this._toastT);
    this.setState({ toast: msg, toastOn: 1 });
    this._toastT = this.later(() => this.setState({ toastOn: 0 }), 2400);
  }

  openMenu() {
    this.setState({ menu: true, menuIn: 0, menuPressed: null });
    this.later(() => this.setState({ menuIn: 1 }), 20);
  }

  closeMenu() {
    this.setState({ menuIn: 0 });
    this.later(() => this.setState({ menu: false }), 240);
  }

  pickMenu(id) {
    this.setState({ menuPressed: id });
    this.later(() => this.go(id, id === 'componi' ? { sent: false } : null), 190);
  }

  openStory(i) {
    clearTimeout(this._storyT);
    this.setState({ story: i, storyFill: 0 });
    this.later(() => this.setState({ storyFill: 1 }), 40);
    this._storyT = this.later(() => this.nextStory(), 5050);
  }

  nextStory() {
    const s = this.S();
    if (s.story === null || s.story === undefined) return;
    if (s.story >= 5) this.closeStory(); else this.openStory(s.story + 1);
  }

  prevStory() {
    const s = this.S();
    this.openStory(Math.max(0, (s.story || 0) - 1));

  togglePlay(id) {
    const s = this.S();
    if (s.playing === id) { this.setState({ paused: !s.paused }); return; }
    clearInterval(this._play);
    this.setState({ playing: id, paused: false, playPos: 0 });
    this._play = setInterval(() => {
      const t = this.S();
      if (!t.playing || t.paused) return;
      const p = t.playPos + 1 / 180;
      if (p >= 1) { clearInterval(this._play); this.setState({ playing: null, playPos: 0 }); }
      else this.setState({ playPos: p });
    }, 500);
  }

  stopPlay() {
    clearInterval(this._play);
    this.setState({ playing: null, playPos: 0, paused: false });
  }

    }));

    // Calendario
    const raw = [];
    [28, 29, 30].forEach((n) => raw.push({ label: String(n), out: true }));
    for (let d = 1; d <= 31; d++) raw.push({ label: String(d), d });
    raw.push({ label: '1', out: true });
    const cells = raw.map((c, i) => {
      const sunday = i % 7 === 6;
      const sel = !c.out && c.d === s.day;
      const today = !c.out && c.d === 12;
      return {
        label: c.label, disabled: !!c.out, sel,
        aria: c.out ? 'Fuori mese' : (c.d + ' ottobre' + (today ? ', oggi' : '')),
        bg: c.out ? '#D6D6D6' : sel ? '#FF6501' : sunday ? '#4F4F4F' : '#808080',
        halo: sel ? 1 : 0,
        ring: today && !sel ? '0 0 0 2px #F0F0F0, 0 0 0 3.5px #FF6501' : 'none',
        cursor: c.out ? 'default' : 'pointer',
        pick: () => { if (!c.out) this.setState({ day: c.d }); }
      };
    });
    const day = this.giorno(s.day);

    // Rosario
    const ids = Object.keys(R);
    const row = (id, faded) => {
      const fav = s.favs.indexOf(id) >= 0;
      const on = s.playing === id && !s.paused;
      return {
        name: R[id].name, color: faded ? '#8E8E8E' : '#161616',
        isFav: fav, notFav: !fav,
        favBg: fav ? '#FF6501' : (faded ? '#DADADA' : '#C8C8C8'),
        favLabel: fav ? 'Togli ' + R[id].name + ' dai preferiti' : 'Aggiungi ' + R[id].name + ' ai preferiti',
        fav: () => this.toggleFav(id),
        isPlaying: on, notPlaying: !on,
        playBg: on ? '#FF6501' : (faded ? '#DADADA' : '#C8C8C8'),
        playLabel: on ? 'Pausa' : 'Ascolta ' + R[id].name,
        play: () => this.togglePlay(id),
        open: () => this.go('rosarioDet', { rosario: id })
      };
    };
    const rAll = ids.map((id) => row(id, false));
    const rFav = s.favs.map((id) => row(id, false));
    const rOther = ids.filter((id) => s.favs.indexOf(id) < 0).map((id) => row(id, true));
    const RC = [[A.racc1, 'Rosario del mattino', '10/10/2026'], [A.racc2, 'Rosario della sera', '8/10/2026'], [A.racc3, 'Rosario della fiducia', '4/8/2026'], [A.racc4, 'Rosario per la pace', '3/6/2026'], ['', 'Rosario per la famiglia', '1/5/2026']];
    const racc = RC.map(([img, t, d], i) => ({
      img, hasImg: !!img, noImg: !img, t, d: 'Creata ' + d,
      color: i === 4 ? '#8E8E8E' : '#2E2E2E', sub: i === 4 ? '#9A9A9A' : '#3A3A3A',
      line: i === 4 ? 'transparent' : '#A6A6A6',
      open: () => { this.togglePlay('mariano'); this.toast('In ascolto: ' + t); }
    }));
    const RT = [['tutti', 'Tutti'], ['preferiti', 'Preferiti'], ['raccolte', 'Le mie raccolte']];
    const rTabs = RT.map(([id, label]) => ({ label, on: s.rTab === id, color: s.rTab === id ? '#E25800' : '#555555', line: s.rTab === id ? '#FF6501' : 'transparent', pick: () => this.setState({ rTab: id }) }));
    const ros = { title: s.rTab === 'tutti' ? 'Tutti i rosari' : s.rTab === 'preferiti' ? 'Preferiti' : 'Le mie raccolte', tutti: s.rTab === 'tutti', pref: s.rTab === 'preferiti', racc: s.rTab === 'raccolte', noFav: s.favs.length === 0 };
    const rr = R[s.rosario] || R.mariano;
    const isThis = s.playing === s.rosario;
    const fv = s.favs.indexOf(s.rosario) >= 0;
    const rd = {
      title: rr.title, desc: rr.desc,
      isPause: isThis && !s.paused, isPlay: !(isThis && !s.paused),
      playLabel: isThis && !s.paused ? 'Pausa' : 'Ascolta il ' + rr.name,
      fav: fv, notFav: !fv, favLabel: fv ? 'Nei preferiti' : 'Aggiungi ai preferiti',
      favBg: fv ? '#FF6501' : 'transparent', favFg: fv ? '#FFFFFF' : '#D45400',
      sec: rr.sec.map((x, i) => ({ t: x.t, b: x.b, now: isThis && i === step, color: isThis && i === step ? '#E25800' : '#161616' }))
    };

    // Grazie / La mia firma
    const gz = { o1: s.enter ? 250 : 430, o2: s.enter ? 500 : 690, o3: s.enter ? 170 : 300, cardTop: s.enter ? 248 : 300 };
    const PH = [['Scoprire', 'Questi valori sono anche i miei.'], ['Considerare', 'È importante scegliere, e questa struttura sa usare bene ciò che riceve.'], ['Decidere', 'Come si fa? Quando?'], ['Ricevere', 'Ho fatto una scelta giusta, e ne sono contento.'], ['Rinnovare', 'Lo dico anche agli altri, e lo rifarò.']];
    const cur = s.firmato ? (s.reminder ? 4 : 3) : 2;
    const journey = PH.map(([label, text], i) => ({
      label, text, current: i === cur, line: i < 4,
      dot: i === cur ? 14 : 10,
      fill: i < cur ? '#FF6501' : '#FFFFFF',
      stroke: i <= cur ? '#FF6501' : '#A6A6A6',
      labelColor: i === cur ? '#161616' : (i < cur ? '#555555' : '#8E8E8E'),
      weight: i === cur ? 700 : 400,
      textColor: i === cur ? '#161616' : (i < cur ? '#555555' : '#8E8E8E')
    }));
    const mf = {
      signed: !!s.firmato, unsigned: !s.firmato, rem: !!s.reminder,
      swBg: s.reminder ? '#FF6501' : '#C8C8C8', swX: s.reminder ? 20 : 0,
      remText: s.reminder ? 'Attivo: ti scriveremo in primavera 2027, quando si apre la stagione delle dichiarazioni.' : 'Ti avviseremo in primavera, quando si apre la stagione delle dichiarazioni.'
    };

    // Preghiere
    const PR = [
      { img: A.preg1, by: 'Costanza e Anna', alt: 'Nessuno ha un amore più grande di questo: dare la vita per i propri amici. Costanza e Anna. Le vostre preghiere.' },
      { img: A.wa3, by: 'Teresa', alt: 'C’è più gioia nel dare che nel ricevere. Teresa. Le vostre preghiere.' },
      { img: A.preg3, by: 'Franco', alt: 'La verità vi farà liberi. Franco. Le vostre preghiere.' },
      { img: A.wa1, by: 'Costanza e Anna', alt: 'Nessuno ha un amore più grande di questo: dare la vita per i propri amici. Costanza e Anna. Le vostre preghiere.' },
      { img: A.preg2, by: 'Teresa', alt: 'C’è più gioia nel dare che nel ricevere. Teresa. Le vostre preghiere.' },
      { img: A.wa2, by: 'Franco', alt: 'La verità vi farà liberi. Franco. Le vostre preghiere.' }
    ];
    const prayers = PR.map((p, i) => {
      const on = !!s.pray[i];
      return Object.assign({}, p, {
        on, label: on ? 'Preghi con ' + p.by : 'Prego anch’io',
        bg: on ? '#FF6501' : 'transparent', fg: on ? '#FFFFFF' : '#161616', border: on ? '#FF6501' : '#A6A6A6',
        pray: () => { const mm = Object.assign({}, s.pray); mm[i] = !mm[i]; this.setState({ pray: mm }); },
        share: () => this.openSheet({ img: p.img, alt: p.alt })
      });
    });
    const homePrayers = prayers.slice(0, 4);
    const bgOf = (i) => BGS[i] || BGS[0];
    const mine = s.mine.map((x) => ({ text: x.text, firma: x.firma, img: bgOf(x.bg).img || '', color: bgOf(x.bg).color || '#1F1F1F', share: () => this.openSheet({ prayer: x }) }));
    const c = s.compose;
    const last = s.mine[0] || { text: c.text, firma: c.firma, bg: c.bg };
    const who = (s.nome || c.firma || '').trim();
    const cp = {
      text: c.text, firma: c.firma, img: bgOf(c.bg).img || '', color: bgOf(c.bg).color || '#1F1F1F',
      len: c.text.length, ok: !!c.ok, btnOp: c.text.trim() && c.ok ? 1 : 0.45,
      notSent: !s.sent, sent: !!s.sent,
      sentText: last.text, sentFirma: last.firma, sentImg: bgOf(last.bg).img || '', sentColor: bgOf(last.bg).color || '#1F1F1F',
      thanks: who ? 'Grazie, ' + who + '.' : 'Grazie.',
      bgs: BGS.map((b, i) => ({ label: b.label, img: b.img || '', hasImg: !!b.img, color: b.color || '#000000', sel: c.bg === i, outline: c.bg === i ? '2px solid #FF6501' : '2px solid transparent', pick: () => this.setCompose({ bg: i }) }))
    };

    // Condividi
    const CR = [A.credo1, A.credo2, A.credo3, A.credo4, A.credo5, A.credo6];
    const credo = CR.map((img) => ({ img, alt: 'Io, ci credo. Destina il tuo 8xmille alla Chiesa Cattolica. Sosteniamo le persone nei momenti più difficili.', open: () => this.openSheet({ img, alt: 'Io, ci credo.' }) }))
      .concat([{ img: A.etu, alt: '8xmille: un gesto concreto. Io, ci credo. E tu?', open: () => this.openSheet({ img: A.etu, alt: 'Io, ci credo. E tu?' }) }]);
    const waRail = [PR[3], PR[5], PR[1], PR[0], PR[4], PR[2]].map((p) => ({ img: p.img, alt: p.alt, open: () => this.openSheet({ img: p.img, alt: p.alt }) }));
    const WL = [
      [A.wall1, 'Voi siete la luce del mondo.'], [A.credo4, 'Io, ci credo.'], [A.wall2, 'Ero straniero e mi avete accolto.'],
      [A.wall3, 'Ho avuto fame e mi avete dato da mangiare.'], [A.wall4, 'Io sono con voi tutti i giorni.'], [A.wall5, 'Non abbiate paura.'],
      [A.wall6, 'Dove andrai tu, andrò anch’io.'], [A.wall7, 'C’è più gioia nel dare che nel ricevere.'], [A.credo2, 'Io, ci credo.']
    ];
    const wallItems = WL.map(([img, alt]) => ({ img, alt: alt + ' Io, ci credo.', share: () => this.openSheet({ img, alt }) }));
    const wallPreview = wallItems.slice(0, 6);
    const wallMine = s.wallMine.map((p) => ({ photo: p, share: () => this.openSheet({ frame: p }) }));
    const cd = { photo: s.photo || A.selfie };

    // Scelta del canale
    const it = s.sheet || {};
    const ip = it.prayer || { text: '', firma: '', bg: 0 };
    const sh = {
      op: s.sheetOn ? 1 : 0, ty: s.sheetOn ? 0 : 100,
      isTessera: !!it.tessera, isPrayer: !!it.prayer, isFrame: !!it.frame, isImg: !!it.img,
      img: it.img || '', alt: it.alt || '', frame: it.frame || '',
      pText: ip.text, pFirma: ip.firma, pImg: bgOf(ip.bg).img || '', pColor: bgOf(ip.bg).color || '#1F1F1F'
    };
    const targets = [['whatsapp', 'WhatsApp'], ['instagram', 'Instagram'], ['facebook', 'Facebook'], ['link', 'Copia link'], ['salva', 'Salva']].map(([k, label]) => ({
      label, bg: k === 'whatsapp' ? '#FF6501' : '#FFFFFF', fg: k === 'whatsapp' ? '#FFFFFF' : '#161616', border: k === 'whatsapp' ? '#FF6501' : '#D6D6D6',
      isWa: k === 'whatsapp', isIg: k === 'instagram', isFb: k === 'facebook', isLink: k === 'link', isSave: k === 'salva',
      go: () => this.shareTo(k)
    }));

    // Chat
    const cpr = s.chatPrayer || { text: '', firma: '', bg: 0 };
    const anyContent = !!(s.chatImg || s.chatTessera || s.chatPrayer || s.chatFrame);
    const chat = {
      status: s.chatReply === 1 ? 'Lucia sta scrivendo…' : 'Mamma, Luca, Lucia, tu',
      typing: s.chatReply === 1, reply: s.chatReply === 2,
      isTessera: !!s.chatTessera, isPrayer: !!s.chatPrayer, isFrame: !!s.chatFrame,
      isImg: !anyContent || (!!s.chatImg && !s.chatTessera && !s.chatPrayer && !s.chatFrame),
      img: s.chatImg || A.etu, alt: 'Card della campagna Io, ci credo.',
      pText: cpr.text, pFirma: cpr.firma, pImg: bgOf(cpr.bg).img || '', pColor: bgOf(cpr.bg).color || '#1F1F1F',
      frame: s.chatFrame || ''
    };

    // Photo frame
    const cam = { photo: s.photo || A.selfie, live: !s.shot, shot: !!s.shot, flash: s.flash || 0, flashTr: s.flashTr || 'none' };

    return {
      A, is, fx, h, pad, homePad, mp, tst, mn, menuItems,
      home, gesti, news, st, homePrayers,
      steps, passi, mod, mtabs,
      cells, day,
      rTabs, ros, rAll, rFav, rOther, racc, rd,
      gz, v: { nome: s.nome }, mf, journey,
      prayers, mine, cp,
      cd, credo, waRail, wallItems, wallPreview, wallMine,
      sh, targets, chat, cam
    };
  }
}

return Component;
});
def('Tessera', function () {

class Component extends DCLogic {
  renderVals() {
    const w = Number(this.props.w) || 250;
    const k = w / 250;
    const raw = this.props.nome === undefined ? 'Chiara' : this.props.nome;
    const nome = String(raw || '').trim();
    return { t: { w, h: Math.round(312 * k), k, nome, has: !!nome, empty: !nome } };
  }
}

return Component;
});
def('Preghiera', function () {

class Component extends DCLogic {
  renderVals() {
    const w = Number(this.props.w) || 338;
    const k = w / 338;
    const P = this.props;
    const testo = P.testo === undefined ? 'Signore, insegnami a vedere chi mi sta accanto.' : String(P.testo || '');
    const sfondo = P.sfondo === undefined ? 'img/bg_blu.jpg' : String(P.sfondo || '');
    const firma = P.firma === undefined ? 'Chiara' : String(P.firma || '');
    const hasImg = !!sfondo;
    return {
      p: {
        w, h: Math.round(423 * k), k,
        testo: testo.trim() ? testo : 'Scrivi qui la tua preghiera.',
        op: testo.trim() ? 1 : 0.6,
        firma,
        sfondo, hasImg,
        colore: P.colore || '#1F1F1F',
        a1: hasImg ? 0.5 : 0, a2: hasImg ? 0.4 : 0
      }
    };
  }
}

return Component;
});
def('Frame', function () {

class Component extends DCLogic {
  renderVals() {
    const w = Number(this.props.w) || 390;
    const h = Number(this.props.h) || 666;
    const k = w / 390;
    const r = (n) => Math.round(n * 10) / 10;
    return {
      f: {
        w, h,
        foto: this.props.foto || 'img/selfie.jpg',
        x: r(30 * k), top: r(Math.max(56 * k, h * 0.1)),
        title: r(60 * k), sub: r(17 * k), gap: r(10 * k),
        logo: r(64 * k), lr: r(24 * k), lb: r(24 * k)
      }
    };
  }
}

return Component;
});

  var stage = document.getElementById('stage');
  var phone = document.getElementById('phone');
  function fit() {
    var w = stage.clientWidth, hh = stage.clientHeight;
    var wide = w > 560;
    document.documentElement.classList.toggle('wide', wide);
    var s = wide ? Math.min((w - 64) / 390, (hh - 64) / 844, 1.2) : Math.min(w / 390, hh / 844);
    phone.style.transform = 'scale(' + s + ')';
  }
  window.addEventListener('resize', fit);
  fit();
  P.render(h(REG.Main, { scene: 'splash' }), phone);
})();
