<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Literata:ital,opsz,wght@1,7..72,400&display=swap" rel="stylesheet">
<style>
:root{--sun:#F2B632;--acc:#F2B632}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:#15302A;color:#F4EEDC;font:italic 400 17px/1.5 "Literata",Georgia,serif;
  background-image:radial-gradient(60% 50% at 88% 0%,rgba(242,182,50,.13),transparent 70%),radial-gradient(50% 60% at 0% 100%,rgba(95,165,122,.16),transparent 70%)}
main{max-width:480px;width:100%}
.lock{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;background:var(--acc);color:#1F2A26;margin-bottom:22px}
.lock svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
p.e{font:800 12px/1 "Bricolage Grotesque",Arial,sans-serif;font-style:normal;letter-spacing:.18em;text-transform:uppercase;color:var(--sun);margin:0 0 12px}
h1{font:800 clamp(40px,9vw,64px)/.95 "Bricolage Grotesque",Arial,sans-serif;letter-spacing:-.03em;margin:0 0 14px}
form{margin-top:20px}
label.pw{display:block;font:800 13px/1 "Bricolage Grotesque",Arial,sans-serif;font-style:normal;letter-spacing:.06em;margin-bottom:8px}
input[type=password]{width:100%;height:52px;padding:0 16px;border-radius:14px;border:2px solid rgba(244,238,220,.25);background:rgba(0,0,0,.18);color:#F4EEDC;font:400 18px/1 Arial,sans-serif}
input[type=password]:focus{outline:none;border-color:var(--sun)}
.ricorda{display:flex;align-items:center;gap:10px;margin-top:14px;font-style:normal;font-size:15px;cursor:pointer}
.ricorda input{width:20px;height:20px;accent-color:#F2B632}
.btn{display:inline-flex;align-items:center;gap:10px;margin-top:20px;padding:14px 26px;min-height:50px;border-radius:999px;background:var(--sun);color:#1F2A26;font:800 15px/1 "Bricolage Grotesque",Arial,sans-serif;font-style:normal;border:0;cursor:pointer}
.btn[disabled]{opacity:.6;cursor:wait}
.back{display:inline-block;margin-top:26px;color:rgba(244,238,220,.7);font:800 13px/1 "Bricolage Grotesque",Arial,sans-serif;font-style:normal;text-decoration:none;padding:10px 0}
.err{color:#F2A58F}
</style>
</head>

<main id="lucchetto">
  <div class="lock"><svg viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg></div>
  <p class="e">Area personale</p>
  <h1>Soldi di casa</h1>
  <p id="msg">Si apre con la password dello Spazio personale.</p>
  <form id="f" autocomplete="on">
    <input type="text" name="username" value="spazio-personale" autocomplete="username" hidden>
    <label class="pw" for="pw">Password</label>
    <input type="password" id="pw" name="password" autocomplete="current-password" required autofocus>
    <label class="ricorda"><input type="checkbox" id="ric" checked> Ricordami per 12 ore su questo dispositivo</label><br>
    <button class="btn" id="apri" type="submit">Apri</button>
  </form>

</main>
