<style>
:root{--sun:#6352E8;--acc:#EE8C72}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:#ECEEF2;color:#1E2230;font:italic 400 17px/1.5 "Literata",Georgia,serif;
  background-image:radial-gradient(60% 50% at 88% 0%,rgba(99,82,232,.13),transparent 70%),radial-gradient(50% 60% at 0% 100%,rgba(95,165,122,.16),transparent 70%)}
main{max-width:480px;width:100%}
.lock{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;background:var(--acc);color:#1F2A26;margin-bottom:22px}
.lock svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
p.e{font:800 12px/1 "Bricolage Grotesque",Arial,sans-serif;font-style:normal;letter-spacing:.18em;text-transform:uppercase;color:var(--sun);margin:0 0 12px}
h1{font:800 clamp(40px,9vw,64px)/.95 "Bricolage Grotesque",Arial,sans-serif;letter-spacing:-.03em;margin:0 0 14px}
form{margin-top:20px}
label.pw{display:block;font:800 13px/1 "Bricolage Grotesque",Arial,sans-serif;font-style:normal;letter-spacing:.06em;margin-bottom:8px}
input[type=password]{width:100%;height:52px;padding:0 16px;border-radius:14px;border:2px solid rgba(30,34,48,.25);background:rgba(0,0,0,.18);color:#1E2230;font:400 18px/1 Arial,sans-serif}
input[type=password]:focus{outline:none;border-color:var(--sun)}
.ricorda{display:flex;align-items:center;gap:10px;margin-top:14px;font-style:normal;font-size:15px;cursor:pointer}
.ricorda input{width:20px;height:20px;accent-color:#6352E8}
.btn{display:inline-flex;align-items:center;gap:10px;margin-top:20px;padding:14px 26px;min-height:50px;border-radius:999px;background:var(--sun);color:#FFFFFF;font:800 15px/1 "Bricolage Grotesque",Arial,sans-serif;font-style:normal;border:0;cursor:pointer}
.btn[disabled]{opacity:.6;cursor:wait}
.back{display:inline-block;margin-top:26px;color:rgba(30,34,48,.7);font:800 13px/1 "Bricolage Grotesque",Arial,sans-serif;font-style:normal;text-decoration:none;padding:10px 0}
.err{color:#F2A58F}
</style>

  var msg=document.getElementById('msg'), btn=document.getElementById('apri'), luc=document.getElementById('lucchetto');
  function apri(raw){

      .then(function(key){ return crypto.subtle.decrypt({name:'AES-GCM', iv:u8(IV)}, key, u8(DATI)); })

<style id="tema-rifinitura">
:root{--v:#6352E8;--v-700:#4A3AC2;--v-50:#F4F2FE;--v-100:#E9E5FD;--v-200:#D9D2FB;--l:rgba(30,34,48,.12);--l2:rgba(30,34,48,.2);--t1:#1E2230;--t2:#5B6172;
  --amb-50:#FFF6E6;--amb-600:#9A5B00;--amb-b:#F2C37A}
/* stati attivi: tenue, non pieno */
#fxdock a.on,.sidebar-nav a.nav-item.active,.menu-btn.active,.fx-chips a.on,.tabs button.on,.vchips button.on,.chips button.on{
  background:var(--v-100)!important;color:var(--v-700)!important;box-shadow:inset 0 0 0 1.5px var(--v-200)!important}
#fxdock a.on svg{stroke:var(--v-700)!important}
#fxdock{background:rgba(255,255,255,.9)!important;box-shadow:0 14px 34px -14px rgba(30,34,48,.28),inset 0 0 0 1px var(--l)!important}
#fxdock a{color:var(--t2)!important}#fxdock a:hover{background:var(--v-50)!important;color:var(--v-700)!important}
.seg{background:#E4E7EE!important;box-shadow:none!important}
.seg button{color:var(--t2)!important}
.seg button.on{background:#fff!important;color:var(--v-700)!important;box-shadow:0 1px 2px rgba(30,34,48,.12),0 4px 12px -6px rgba(30,34,48,.25)!important}
/* secondari: bianchi con bordo */
.vbtn,.gnav,.strip .sw,.nav .iconbtn,.iconbtn,.piu,.cambia,.btn.ghost,.carousel-btn,.back-home,.barra .nav,.quick a,.top a.iconbtn{
  background:#fff!important;color:var(--t1)!important;box-shadow:inset 0 0 0 1px var(--l2)!important;border-color:transparent!important}
.vbtn:hover,.gnav:hover,.nav .iconbtn:hover,.iconbtn:hover,.piu:hover,.cambia:hover,.btn.ghost:hover,.carousel-btn:hover,.back-home:hover,.quick a:hover{background:var(--v-50)!important;color:var(--v-700)!important}
.vbtn.attivo{background:var(--v-100)!important;color:var(--v-700)!important;box-shadow:inset 0 0 0 1.5px var(--v-200)!important}
.vbtn.oggi,.barra .oggi{background:#fff!important;color:var(--v-700)!important;box-shadow:inset 0 0 0 1.5px var(--v)!important}
/* calendario */
.days7 button.on{background:var(--v)!important;color:#fff!important}
.strip .sd{background:#fff!important;box-shadow:inset 0 0 0 1px var(--l)!important}
.strip .sd.on{background:var(--v)!important;color:#fff!important;box-shadow:none!important}
.strip .sd.on small{color:rgba(255,255,255,.8)!important}
.strip .sd.oggi:not(.on){box-shadow:inset 0 0 0 2px var(--v)!important}
.strip .sd i.gap{background:#E0951F!important}.strip .sd.on i.gap{background:#FFD38A!important}
.day.today,.agd.today,.gm.oggi{box-shadow:0 0 0 2px var(--v),0 18px 40px -24px rgba(30,34,48,.35)!important}
.day.today .dayhead,.day.today.weekend .dayhead,.agd.today .agh,.gm.oggi .gm-h{background:var(--v-100)!important;color:var(--v-700)!important}
.day.today .dayhead .dn,.day.today .dayhead .dd,.agd.today .agh .q,.agd.today .agh .dl{color:var(--v-700)!important}
.day.today .note{color:var(--t1)!important}
.dayhead .addx,.day.today .dayhead .addx{background:#fff!important;color:var(--v-700)!important;box-shadow:inset 0 0 0 1.5px var(--v-200)!important}
.addrow{background:var(--v-50)!important;color:var(--v-700)!important;box-shadow:inset 0 0 0 1.5px var(--v-100)!important}
.addrow:hover{background:var(--v-100)!important}
.addrow b{background:var(--v)!important;color:#fff!important}
.who.ask,.agr.gap .x small,.agh .gapn{background:var(--amb-50)!important;color:var(--amb-600)!important;border:1.5px dashed var(--amb-b)!important;box-shadow:none!important}
.ev.fx-next{background:var(--v-50)!important;box-shadow:inset 4px 0 0 var(--v)!important}
.ev.fx-next .tm::after{background:var(--v)!important;color:#fff!important}
/* intestazioni delle card (giorni, agenda): grigio appena accennato, non velatura scura */
.gm-h,.dayhead,.day.weekend .dayhead,.agh{background:#F6F7FA!important;border-bottom:1px solid var(--l)!important}
.gm.we,.day.weekend,.agd.we{background:#FBFBFD!important}
/* menu' */
.gm-h em{background:var(--v)!important;color:#fff!important}
.ing{background:var(--v-50)!important;box-shadow:inset 0 0 0 1.5px var(--v-200)!important;color:var(--t1)!important}
/* vademecum, salute, soldi */
.mant-num,.vsez-ico,.title-ico{background:var(--v-100)!important;color:var(--v-700)!important;box-shadow:none!important;border-color:transparent!important}
.mant-month-urgent .mant-num{background:var(--v)!important;color:#fff!important}
.mesi-tab button.on{background:var(--v-100)!important;color:var(--v-700)!important}
/* azione principale: viola pieno, con ombra morbida */
.tutto:not(:disabled),.addbox button,.btn.primary,.fx-actions .pri,.sub-link a.pri{background:var(--v)!important;color:#fff!important;box-shadow:0 6px 16px -8px rgba(99,82,232,.7)!important}
/* fuoco da tastiera visibile */
a:focus-visible,button:focus-visible,[role=button]:focus-visible,[tabindex]:focus-visible{outline:2.5px solid var(--v)!important;outline-offset:2px!important}
</style></body>
